name: Package Plugin

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ 17, 21 ]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3

      # 修复 Gradle 9.x 的隐式依赖问题
      - name: Fix implicit dependency for sourcesJar
        run: |
          echo 'tasks.named("sourcesJar") { dependsOn("generateVersionProperties") }' >> greendao-gradle-plugin/build.gradle.kts

      - name: Build
        run: ./gradlew build

      - name: Upload Plugin Jar
        uses: actions/upload-artifact@v4
        with:
          name: green-dao-plugin-java${{ matrix.java }}
          path: build/libs/*.jar
          retention-days: 7
